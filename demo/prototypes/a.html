<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prototype A · Classic Felt</title>
<style>
:root{
  --base:#898781; --full:#1baf7a; --you:#2a78d6;
  --gold:#d8b25a; --gold-2:#f3d98f; --ink:#f4efe2;
  --felt-1:#2a8a52; --felt-2:#145c33; --felt-3:#0a3a1f;
  --cw:clamp(52px, 6.4vmin, 132px);
  --ch:calc(var(--cw)*1.4);
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:#070806;
  color:var(--ink);
  font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;
  overflow:hidden;
}
/* ---------- room + lighting ---------- */
.room{position:fixed;inset:0;display:grid;grid-template-rows:auto 1fr auto;
  background:
    radial-gradient(ellipse 70% 55% at 50% 38%, rgba(255,230,170,.10), transparent 70%),
    radial-gradient(ellipse at 50% 120%, #1a120a 0%, #070806 60%);
}
.lamp{position:fixed;left:50%;top:-30vh;width:120vw;height:120vh;transform:translateX(-50%);
  background:radial-gradient(ellipse 45% 50% at 50% 50%, rgba(255,236,190,.16), transparent 70%);
  pointer-events:none;z-index:5;mix-blend-mode:screen;animation:flicker 7s infinite}
@keyframes flicker{0%,100%{opacity:1}47%{opacity:.93}50%{opacity:1}52%{opacity:.96}}
header{display:flex;align-items:center;justify-content:space-between;padding:1.4vmin 2.4vmin;z-index:6}
.brand{font-variant:small-caps;letter-spacing:.18em;font-size:clamp(13px,1.6vmin,24px);color:var(--gold)}
.brand b{color:var(--gold-2);font-weight:600}
.handno{font-size:clamp(12px,1.5vmin,22px);letter-spacing:.2em;color:#cbbf9f}
.handno span{display:inline-block;width:.7em;height:.7em;border-radius:50%;border:1px solid var(--gold);margin-left:.4em;vertical-align:middle;transition:background .4s}
.handno span.on{background:var(--gold)}

/* live plaque */
.plaque{display:flex;gap:1.4vmin;align-items:center;padding:.7vmin 1.4vmin;border-radius:6px;
  background:linear-gradient(#2a2010,#17110a);border:1px solid #6d5528;box-shadow:inset 0 1px 0 rgba(255,220,150,.25),0 4px 14px rgba(0,0,0,.6);
  font-size:clamp(11px,1.25vmin,18px)}
.plaque .live{color:#ff5a4a;letter-spacing:.2em;font-weight:700;font-family:system-ui,sans-serif;font-size:.8em}
.plaque .live::before{content:"";display:inline-block;width:.6em;height:.6em;border-radius:50%;background:#ff5a4a;margin-right:.4em;animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.25}}
.plaque .stat{display:flex;flex-direction:column;gap:3px;min-width:7.5em}
.plaque .stat i{font-style:normal;color:#cbbf9f;font-size:.85em}
.plaque .bar{height:4px;background:rgba(255,255,255,.1);border-radius:2px;overflow:hidden}
.plaque .bar b{display:block;height:100%;border-radius:2px;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
.plaque .stat em{font-style:normal;font-family:system-ui,sans-serif;font-weight:700;font-variant-numeric:tabular-nums}

/* ---------- table ---------- */
.stage{position:relative;display:grid;place-items:center;min-height:0}
.table{position:relative;height:min(100%, 50vw);aspect-ratio:1.9/1;max-width:96vw;
  border-radius:0 0 50% 50% / 0 0 92% 92%;
  padding:2.2vmin;
  background:linear-gradient(180deg,#3b2414,#1c0f07 40%,#2b180b);
  box-shadow:0 3vmin 8vmin rgba(0,0,0,.85), inset 0 2px 0 rgba(255,200,140,.25), inset 0 -8px 20px rgba(0,0,0,.6);
}
.table::before{ /* padded leather rail sheen */
  content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:radial-gradient(ellipse 60% 30% at 50% 100%, rgba(255,190,120,.18), transparent 70%);
}
.felt{position:relative;width:100%;height:100%;border-radius:0 0 50% 50% / 0 0 92% 92%;overflow:hidden;
  background:
    radial-gradient(ellipse 60% 70% at 50% 35%, var(--felt-1), var(--felt-2) 55%, var(--felt-3) 100%);
  box-shadow:inset 0 0 6vmin rgba(0,0,0,.75), inset 0 0 0 2px rgba(0,0,0,.4);
}
.felt::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 .9 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");}
.print{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.print text{fill:rgba(243,217,143,.55);font-family:inherit;letter-spacing:.35em}

/* dealer + shoe */
.dealer{position:absolute;left:50%;top:6%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:.8vmin}
.dealer .lbl,.seat .lbl{font-variant:small-caps;letter-spacing:.25em;font-size:clamp(11px,1.35vmin,20px);color:rgba(243,217,143,.85);text-shadow:0 1px 2px #000}
.hand{display:flex;min-height:var(--ch);min-width:calc(var(--cw)*1.7)}
.hand .card + .card{margin-left:calc(var(--cw)*-.42)}
.shoe{position:absolute;right:6%;top:4%;width:calc(var(--cw)*1.5);height:calc(var(--ch)*.9);
  transform:rotate(-8deg);border-radius:8px 8px 14px 14px;
  background:linear-gradient(160deg,#3a2a1a,#120c06);box-shadow:0 10px 20px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.15)}
.shoe::before{content:"";position:absolute;left:12%;right:12%;top:-10%;height:60%;border-radius:4px;
  background:repeating-linear-gradient(45deg,#7a1020 0 4px,#5b0b18 4px 8px);border:2px solid #f1e6d2}
.shoe::after{content:"";position:absolute;inset:30% 6% 6%;border-radius:6px;background:linear-gradient(#1b130b,#0c0805)}
.discard{position:absolute;left:7%;top:5%;width:calc(var(--cw)*1);height:calc(var(--ch)*.8);border-radius:6px;transform:rotate(10deg);
  background:linear-gradient(#1b130b,#0c0805);box-shadow:0 8px 16px rgba(0,0,0,.6)}

/* seats */
.seat{position:absolute;display:flex;flex-direction:column;align-items:center;gap:.9vmin;transform:translate(-50%,-50%)}
.seat.baseline{left:17%;top:50%;rotate:14deg}
.seat.you{left:50%;top:66%}
.seat.full{left:83%;top:50%;rotate:-14deg}
.ring{position:relative;padding:1.2vmin 1.6vmin;border-radius:50%;}
.ring::before{content:"";position:absolute;inset:-6% -12%;border-radius:50%;border:2px solid rgba(243,217,143,.35);box-shadow:inset 0 0 20px rgba(0,0,0,.25)}
.seat .lbl b{color:color-mix(in srgb,var(--c),#fff 35%)}
.seat.baseline{--c:var(--base)} .seat.full{--c:var(--full)} .seat.you{--c:var(--you)}
.seat .name{display:flex;align-items:center;gap:.6em;background:rgba(0,0,0,.45);padding:.35em .9em;border-radius:999px;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c),transparent 50%)}
.seat .name::before{content:"";width:.7em;height:.7em;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c)}
.think{height:1.6em;font-family:system-ui,sans-serif;font-size:clamp(10px,1.2vmin,17px);color:#e9e2cc;opacity:0;transition:opacity .3s}
.think.on{opacity:1}
.think .dots i{display:inline-block;width:.45em;height:.45em;border-radius:50%;background:var(--c);margin:0 .12em;animation:bob 1s infinite}
.think .dots i:nth-child(2){animation-delay:.15s}.think .dots i:nth-child(3){animation-delay:.3s}
@keyframes bob{50%{transform:translateY(-.4em);opacity:.5}}
.rail{display:flex;gap:.8vmin}
.slot{position:relative;width:calc(var(--cw)*.62);height:calc(var(--cw)*.62);border-radius:50%;border:1px dashed rgba(243,217,143,.3);perspective:600px}

/* ---------- cards ---------- */
.card{position:relative;width:var(--cw);height:var(--ch);perspective:900px;flex:none;filter:drop-shadow(0 6px 8px rgba(0,0,0,.5))}
.card .in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.card.down .in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:calc(var(--cw)*.08);backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.front{background:linear-gradient(160deg,#fffdf7,#efe8d8);color:#16130f;border:1px solid #d9cfb8}
.front.red{color:#b3151f}
.front .cn{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.95;font-weight:700;font-size:calc(var(--cw)*.24);font-family:Georgia,serif}
.front .cn small{font-size:.8em}
.front .tl{left:7%;top:5%}.front .br{right:7%;bottom:5%;transform:rotate(180deg)}
.front .pip{position:absolute;inset:0;display:grid;place-items:center;font-size:calc(var(--cw)*.62)}
.front .court{position:absolute;inset:22% 20%;border:1.5px solid currentColor;border-radius:4px;display:grid;place-items:center;font-size:calc(var(--cw)*.42);font-weight:700;
  background:repeating-linear-gradient(135deg,rgba(216,178,90,.18) 0 3px,transparent 3px 7px)}
.back{transform:rotateY(180deg);background:#7a1020;border:calc(var(--cw)*.05) solid #f6efe0;
  background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.12) 0 2px,transparent 2px 7px),repeating-linear-gradient(-45deg,rgba(255,255,255,.12) 0 2px,transparent 2px 7px)}
.back::after{content:"";position:absolute;inset:12%;border:1px solid rgba(255,220,160,.6);border-radius:4px}

/* ---------- chips ---------- */
.chip{--chip:#c33;position:relative;width:clamp(64px,10vmin,150px);aspect-ratio:1;border-radius:50%;border:none;cursor:pointer;
  font:700 clamp(11px,1.6vmin,22px)/1 system-ui,sans-serif;letter-spacing:.08em;color:#fff;text-transform:uppercase;
  background:
    radial-gradient(circle,var(--chip) 0 52%,transparent 53%),
    repeating-conic-gradient(#fff 0 10deg,var(--chip) 10deg 30deg);
  box-shadow:0 0 0 3px rgba(0,0,0,.35),0 8px 0 -1px color-mix(in srgb,var(--chip),#000 45%),0 14px 20px rgba(0,0,0,.6),inset 0 0 0 calc(clamp(64px,10vmin,150px)*.09) var(--chip);
  transition:transform .18s, box-shadow .18s, opacity .3s, filter .3s}
.chip span{position:relative;display:grid;place-items:center;width:62%;height:62%;margin:auto;border-radius:50%;border:2px dashed rgba(255,255,255,.55);text-shadow:0 1px 2px rgba(0,0,0,.5)}
.chip:hover{transform:translateY(-6px) rotate(-8deg)}
.chip:active{transform:translateY(2px)}
.chip:disabled{opacity:.25;cursor:default;transform:none;filter:grayscale(.6)}
.chip.hit{--chip:#b42332}.chip.stand{--chip:#2b3e8f}.chip.double{--chip:#c38a1c}.chip.split{--chip:#5a2a87}
.controls{display:flex;justify-content:center;align-items:center;gap:2.4vmin;padding:1.6vmin 0 2.4vmin;z-index:6;min-height:calc(clamp(64px,10vmin,150px) + 4vmin)}
.cta{font:600 clamp(13px,1.8vmin,26px)/1 inherit;font-family:inherit;letter-spacing:.2em;font-variant:small-caps;color:#1b1208;cursor:pointer;
  padding:1.4vmin 3.4vmin;border-radius:999px;border:1px solid #fff3c4;
  background:linear-gradient(#f6dd93,#c8973c);box-shadow:0 6px 18px rgba(216,178,90,.35),inset 0 1px 0 #fff8dd;transition:transform .2s}
.cta:hover{transform:translateY(-2px) scale(1.03)}
.hide{display:none!important}
.mini-chip{position:absolute;inset:0;border-radius:50%;display:grid;place-items:center;font:700 calc(var(--cw)*.095)/1 system-ui,sans-serif;color:#fff;letter-spacing:.05em;text-transform:uppercase;
  background:radial-gradient(circle,var(--chip) 0 55%,transparent 56%),repeating-conic-gradient(#fff 0 12deg,var(--chip) 12deg 36deg);
  box-shadow:0 4px 8px rgba(0,0,0,.5)}
.sealed{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.3,.7,.2,1)}
.sealed > div{position:absolute;inset:0;border-radius:50%;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.sealed .s-back{background:radial-gradient(circle,#2a1a0c 0 55%,transparent 56%),repeating-conic-gradient(var(--gold) 0 12deg,#3a2614 12deg 36deg);box-shadow:0 4px 8px rgba(0,0,0,.5);display:grid;place-items:center;color:var(--gold);font-size:calc(var(--cw)*.2)}
.sealed .s-front{transform:rotateY(180deg)}
.sealed.open{transform:rotateY(180deg)}
.mark{position:absolute;right:-18%;top:-18%;width:46%;height:46%;border-radius:50%;display:grid;place-items:center;font:900 calc(var(--cw)*.2)/1 system-ui,sans-serif;color:#fff;
  transform:scale(0);transition:transform .45s cubic-bezier(.2,1.8,.4,1);z-index:3;box-shadow:0 2px 6px rgba(0,0,0,.6)}
.mark.ok{background:#1baf7a}.mark.no{background:#c8323c}
.mark.on{transform:scale(1)}

/* banner */
.banner{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);opacity:0;z-index:20;pointer-events:none;
  font-size:clamp(28px,7vmin,120px);letter-spacing:.3em;font-variant:small-caps;color:var(--gold-2);
  text-shadow:0 0 30px rgba(216,178,90,.6),0 4px 0 #3b2414;transition:all .6s cubic-bezier(.2,.9,.2,1);white-space:nowrap}
.banner.on{opacity:1;transform:translate(-50%,-50%) scale(1)}

/* ---------- results ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .6s;z-index:28}
.scrim.on{opacity:1;pointer-events:auto}
.results{position:fixed;left:50%;bottom:0;width:min(1180px,96vw);max-height:88vh;overflow:auto;z-index:30;
  transform:translate(-50%,105%);transition:transform .9s cubic-bezier(.2,.85,.2,1);
  background:linear-gradient(#1a3a26,#0e2416);border:1px solid #6d5528;border-bottom:none;border-radius:18px 18px 0 0;
  box-shadow:0 -20px 60px rgba(0,0,0,.7), inset 0 1px 0 rgba(243,217,143,.3);padding:2.6vmin 3vmin 3vmin}
.results.on{transform:translate(-50%,0)}
.results h2{font-variant:small-caps;letter-spacing:.25em;color:var(--gold);font-weight:400;font-size:clamp(16px,2.2vmin,32px)}
.score{display:flex;flex-wrap:wrap;gap:3vmin;margin:1.4vmin 0 2vmin;font-size:clamp(16px,2.6vmin,40px)}
.score div{display:flex;align-items:baseline;gap:.4em}
.score b{font-family:system-ui,sans-serif;font-size:1.5em;font-variant-numeric:tabular-nums}
.res-grid{display:grid;grid-template-columns:1fr minmax(200px,280px);gap:2.4vmin}
table{width:100%;border-collapse:collapse;font-size:clamp(12px,1.55vmin,22px)}
th{font-weight:400;font-variant:small-caps;letter-spacing:.15em;color:#cbbf9f;text-align:left;padding:.8vmin 1vmin;border-bottom:1px solid rgba(243,217,143,.3)}
td{padding:1.1vmin 1vmin;border-bottom:1px solid rgba(243,217,143,.12)}
tr.row{cursor:pointer;transition:background .2s}
tr.row:hover{background:rgba(243,217,143,.07)}
tr.row td:first-child::before{content:"▸";display:inline-block;margin-right:.6em;color:var(--gold);transition:transform .3s}
tr.row.open td:first-child::before{transform:rotate(90deg)}
.minicards{display:inline-flex;gap:3px;vertical-align:middle;font-family:system-ui,sans-serif;font-weight:700}
.minicards span{background:#f7f1e3;color:#16130f;border-radius:3px;padding:.15em .3em;font-size:.85em}
.minicards span.r{color:#b3151f}
.minicards em{font-style:normal;color:#cbbf9f;margin:0 .3em;font-size:.85em;align-self:center}
.act{font-family:system-ui,sans-serif;font-weight:600}
.act.ok::after{content:" ✓";color:#3fdc9c}.act.no::after{content:" ✗";color:#ff6a6a}
.act.inv{color:#ff9a8a;font-style:italic}
td.basic{color:var(--gold-2);font-family:system-ui,sans-serif;font-weight:600}
tr.detail td{padding:0;border:none}
.detail-in{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s cubic-bezier(.2,.8,.2,1)}
tr.detail.open .detail-in{grid-template-rows:1fr}
.detail-in > div{overflow:hidden}
.dgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:1.6vmin;padding:1.4vmin 1vmin 2vmin}
.why{background:rgba(0,0,0,.25);border-radius:10px;padding:1.2vmin 1.4vmin;border-left:3px solid var(--c);font-size:.92em;line-height:1.45}
.why h4{font-variant:small-caps;letter-spacing:.15em;color:var(--c);font-weight:600;margin-bottom:.5em}
.odds h4{color:var(--gold)}
.dist{display:grid;grid-template-columns:auto 1fr auto;gap:.35em .6em;align-items:center;font-family:system-ui,sans-serif;font-size:.85em;margin-top:.6em}
.dist .b{height:.7em;background:rgba(255,255,255,.08);border-radius:2px;overflow:hidden}
.dist .b i{display:block;height:100%;background:var(--full);width:0;transition:width .9s cubic-bezier(.2,.8,.2,1)}
.dist .b i.bust{background:#c8323c}
.bustbig{font-family:system-ui,sans-serif;font-size:1.8em;font-weight:800;color:#ff8a7a}
.board{background:linear-gradient(#2a2010,#17110a);border:1px solid #6d5528;border-radius:12px;padding:1.6vmin;align-self:start}
.board h3{font-variant:small-caps;letter-spacing:.2em;font-weight:400;color:var(--gold);font-size:clamp(13px,1.6vmin,22px);margin-bottom:1vmin;display:flex;justify-content:space-between}
.board .r{margin:1.2vmin 0}
.board .r div{display:flex;justify-content:space-between;font-size:clamp(12px,1.45vmin,20px)}
.board .r b{font-family:system-ui,sans-serif}
.board .bar{height:8px;background:rgba(255,255,255,.08);border-radius:4px;margin-top:4px;overflow:hidden}
.board .bar i{display:block;height:100%;width:0;border-radius:4px;transition:width 1.4s cubic-bezier(.2,.8,.2,1)}
.board small{color:#a99c7c;font-size:clamp(10px,1.15vmin,16px)}
.again{margin-top:2vmin;width:100%}
@media (max-aspect-ratio:4/3){ .res-grid{grid-template-columns:1fr} .dgrid{grid-template-columns:1fr} }
</style>
</head>
<body>
<div class="lamp"></div>
<div class="room">
  <header>
    <div class="brand"><b>Ablation</b> Blackjack · Baseline vs Full harness</div>
    <div class="plaque" id="plaque"></div>
    <div class="handno" id="handno">HAND <span></span><span></span><span></span></div>
  </header>

  <div class="stage">
    <div class="table" id="table">
      <div class="felt">
        <svg class="print" viewBox="0 0 1900 1000" preserveAspectRatio="none">
          <defs>
            <path id="arc1" d="M 470 250 Q 950 490 1430 250"/>
            <path id="arc2" d="M 480 315 Q 950 555 1420 315"/>
          </defs>
          <text font-size="38"><textPath href="#arc1" startOffset="50%" text-anchor="middle">BLACKJACK PAYS 3 TO 2</textPath></text>
          <text font-size="22"><textPath href="#arc2" startOffset="50%" text-anchor="middle">DEALER STANDS ON ALL 17s</textPath></text>
        </svg>
        <div class="discard"></div>
        <div class="shoe" id="shoe"></div>
        <div class="dealer"><div class="hand" id="dealerHand"></div><div class="lbl">Dealer</div></div>

        <div class="seat baseline" data-seat="baseline">
          <div class="lbl name"><b>Baseline</b></div>
          <div class="ring"><div class="hand" id="h-baseline"></div></div>
          <div class="think" id="t-baseline"><span class="dots"><i></i><i></i><i></i></span> deciding</div>
          <div class="rail" id="r-baseline"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
        </div>
        <div class="seat you" data-seat="you">
          <div class="lbl name"><b>You</b></div>
          <div class="ring"><div class="hand" id="h-you"></div></div>
          <div class="think" id="t-you" style="opacity:0"></div>
          <div class="rail" id="r-you"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
        </div>
        <div class="seat full" data-seat="full">
          <div class="lbl name"><b>Full harness</b></div>
          <div class="ring"><div class="hand" id="h-full"></div></div>
          <div class="think" id="t-full"><span class="dots"><i></i><i></i><i></i></span> deciding</div>
          <div class="rail" id="r-full"><div class="slot"></div><div class="slot"></div><div class="slot"></div></div>
        </div>
      </div>
    </div>
  </div>

  <div class="controls" id="controls">
    <button class="cta" id="dealBtn">Deal the first hand</button>
    <button class="chip hit hide" data-a="Hit"><span>Hit</span></button>
    <button class="chip stand hide" data-a="Stand"><span>Stand</span></button>
    <button class="chip double hide" data-a="Double"><span>Double</span></button>
    <button class="chip split hide" data-a="Split"><span>Split</span></button>
    <button class="cta hide" id="nextBtn">Next hand</button>
    <button class="cta hide" id="revealBtn">Reveal the table</button>
  </div>
</div>

<div class="banner" id="banner">The Reveal</div>
<div class="scrim" id="scrim"></div>
<section class="results" id="results">
  <h2>Results · three hands</h2>
  <div class="score" id="score"></div>
  <div class="res-grid">
    <div><table><thead><tr><th>Hand</th><th>You</th><th>Baseline</th><th>Full harness</th><th>Basic strategy</th></tr></thead><tbody id="rows"></tbody></table></div>
    <aside class="board" id="board"></aside>
  </div>
</section>

<script>
/* ---------- fake data (3 hands) ---------- */
const HANDS = [
  { player:[["10","♠"],["6","♥"]], up:["10","♦"], hole:["7","♣"], label:"Hard 16 vs 10", basic:"Hit",
    baseline:{action:"Stand", text:"I have 16, which is a weak hand. If I hit, any card 6 or higher busts me. The dealer might bust too, so standing is the safer play. Action: STAND"},
    full:{action:"Hit", text:"The probability tool puts my bust chance at 61.5% if I hit, but standing on 16 only wins when the dealer busts, and with a 10 up that happens just 22.7% of the time. Strategy information: hit hard 12–16 against 7 or higher. Self-check: agrees. Action: HIT"},
    odds:{bust:61.5, dealer:{"17":12.4,"18":12.3,"19":12.3,"20":36.8,"21":3.5,"Bust":22.7}} },
  { player:[["8","♣"],["8","♦"]], up:["6","♠"], hole:["K","♥"], label:"Pair of 8s vs 6", basic:"Split",
    baseline:{action:"Split", text:"A pair of 8s makes 16, the worst total. Splitting gives me two hands that start at 8 against a weak dealer 6. Action: SPLIT"},
    full:{action:"Split", text:"Always split 8s. The dealer's 6 busts 42.3% of the time, so two hands starting from 8 beat one stiff 16. Bust chance if I hit instead: 61.5%. Self-check: consistent with the strategy information. Action: SPLIT"},
    odds:{bust:61.5, dealer:{"17":16.5,"18":10.6,"19":10.7,"20":10.2,"21":9.7,"Bust":42.3}} },
  { player:[["A","♥"],["7","♣"]], up:["3","♥"], hole:["9","♠"], label:"Soft 18 vs 3", basic:"Double",
    baseline:{action:null, text:"Soft 18 is a pretty good hand. I could stand, but the dealer has a 3, so there is some chance they make a strong hand. I think the best move depends on the casino rules and how I feel about risk."},
    full:{action:"Double", text:"Soft 18 cannot bust on one card: bust chance 0%. The dealer's 3 busts 37.2% of the time. Strategy information: double soft 17–18 against 3–6 when allowed. Self-check: doubling adds value at zero bust risk. Action: DOUBLE"},
    odds:{bust:0, dealer:{"17":13.1,"18":13.4,"19":12.6,"20":12.1,"21":11.6,"Bust":37.2}} },
];
const BOARD = { deals:141, visitors:61.0, baseline:44.0, full:89.4 };

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const wait = ms => new Promise(r => setTimeout(r, ms));
const red = s => s==="♥"||s==="♦";
function cardEl([r,s], down=true){
  const c = document.createElement("div"); c.className = "card" + (down?" down":"");
  const court = ["J","Q","K"].includes(r);
  c.innerHTML = `<div class="in"><div class="face front ${red(s)?"red":""}">
      <div class="cn tl">${r}<small>${s}</small></div>
      ${court?`<div class="court">${r}</div>`:`<div class="pip">${s}</div>`}
      <div class="cn br">${r}<small>${s}</small></div></div>
    <div class="face back"></div></div>`;
  return c;
}
function flyFrom(el, fromEl, {dur=620, delay=0, spin=-25}={}){
  const a = fromEl.getBoundingClientRect(), b = el.getBoundingClientRect();
  let dx = a.left + a.width/2 - (b.left + b.width/2), dy = a.top + a.height/2 - (b.top + b.height/2);
  const seat = el.closest(".seat"), ang = seat ? -(parseFloat(getComputedStyle(seat).rotate)||0)*Math.PI/180 : 0;
  [dx, dy] = [dx*Math.cos(ang) - dy*Math.sin(ang), dx*Math.sin(ang) + dy*Math.cos(ang)];
  return el.animate([
    {transform:`translate(${dx}px,${dy}px) rotate(${spin}deg) scale(.7)`, opacity:.0},
    {opacity:1, offset:.15},
    {transform:"translate(0,0) rotate(0) scale(1)", opacity:1}
  ], {duration:dur, delay, easing:"cubic-bezier(.15,.75,.25,1)", fill:"backwards"}).finished;
}
async function deal(card, target, delay, faceUp=true){
  target.appendChild(card);
  await flyFrom(card, $("#shoe"), {delay});
  if(faceUp){ card.classList.remove("down"); }
}
const correct = (a, h) => a === h.basic;
const fmt = a => a ?? "invalid";

/* ---------- state ---------- */
let idx = -1, picks = [];
const chips = $$(".chip");

function renderPlaque(extra){
  const v = extra ?? BOARD.visitors;
  $("#plaque").innerHTML = `<span class="live">LIVE</span>` + [["Visitors",v,"var(--you)"],["Baseline",BOARD.baseline,"var(--base)"],["Full harness",BOARD.full,"var(--full)"]]
    .map(([n,p,c])=>`<div class="stat"><div style="display:flex;justify-content:space-between"><i>${n}</i><em>${p.toFixed(0)}%</em></div><div class="bar"><b style="width:${p}%;background:${c}"></b></div></div>`).join("");
}
renderPlaque();

async function clearTable(){
  const cards = $$(".card");
  const disc = $(".discard").getBoundingClientRect();
  await Promise.all(cards.map((c,i)=>{
    const b = c.getBoundingClientRect();
    return c.animate([{transform:"none",opacity:1},{transform:`translate(${disc.left-b.left}px,${disc.top-b.top}px) rotate(${200+i*7}deg) scale(.6)`,opacity:0}],
      {duration:520, delay:i*40, easing:"cubic-bezier(.5,0,.75,0)", fill:"forwards"}).finished;
  }));
  cards.forEach(c=>c.remove());
}

async function playHand(){
  idx++;
  $$("#handno span").forEach((s,i)=>s.classList.toggle("on", i<=idx));
  const h = HANDS[idx];
  const seats = ["baseline","you","full"];
  // deal order like a real table: one card to each seat, dealer up, second card to each seat, dealer hole
  let t = 0;
  const jobs = [];
  for(let round=0; round<2; round++){
    for(const s of seats){ jobs.push(deal(cardEl(h.player[round]), $("#h-"+s), t)); t += 230; }
    jobs.push(deal(cardEl(round===0?h.up:h.hole), $("#dealerHand"), t, round===0)); t += 230;
  }
  await Promise.all(jobs);
  // agents deliberate
  $("#t-baseline").classList.add("on"); $("#t-full").classList.add("on");
  chips.forEach(c=>{ c.classList.remove("hide"); c.disabled = (c.dataset.a==="Split" && h.player[0][0]!==h.player[1][0]); });
  chips.forEach((c,i)=>c.animate([{transform:"translateY(40px) scale(.6)",opacity:0},{transform:"none",opacity:1}],{duration:450,delay:i*70,easing:"cubic-bezier(.2,1.4,.4,1)",fill:"backwards"}));
  for(const [s,d] of [["baseline",900],["full",1500]]){
    setTimeout(()=>{ $("#t-"+s).classList.remove("on"); placeSealed(s, idx); }, d);
  }
}
function placeSealed(seat, i){
  const slot = $("#r-"+seat).children[i];
  const h = HANDS[i], a = h[seat].action;
  slot.innerHTML = `<div class="sealed"><div class="s-back">?</div><div class="s-front"><div class="mini-chip" style="--chip:${seat==="full"?"#138a5f":"#6d6b66"}">${a ?? "—"}</div></div></div><div class="mark"></div>`;
  flyFrom(slot.firstChild, $("#h-"+seat), {dur:500, spin:0});
}
const CHIPCOL = {Hit:"#b42332",Stand:"#2b3e8f",Double:"#c38a1c",Split:"#5a2a87"};
chips.forEach(btn=>btn.addEventListener("click", async ()=>{
  if(btn.disabled) return;
  const a = btn.dataset.a; picks[idx] = a;
  chips.forEach(c=>c.disabled = true);
  const slot = $("#r-you").children[idx];
  slot.innerHTML = `<div class="mini-chip" style="--chip:${CHIPCOL[a]}">${a}</div><div class="mark"></div>`;
  await flyFrom(slot.firstChild, btn, {dur:650, spin:360});
  chips.forEach(c=>c.classList.add("hide"));
  (idx<2 ? $("#nextBtn") : $("#revealBtn")).classList.remove("hide");
}));

$("#dealBtn").onclick = ()=>{ $("#dealBtn").classList.add("hide"); playHand(); };
$("#nextBtn").onclick = async ()=>{ $("#nextBtn").classList.add("hide"); await clearTable(); playHand(); };
$("#revealBtn").onclick = async ()=>{
  $("#revealBtn").classList.add("hide");
  $("#banner").classList.add("on"); await wait(1100); $("#banner").classList.remove("on"); await wait(300);
  for(let i=0;i<3;i++){
    for(const s of ["you","baseline","full"]){
      const slot = $("#r-"+s).children[i];
      const sealed = slot.querySelector(".sealed"); if(sealed) sealed.classList.add("open");
      await wait(s==="you"?120:420);
      const a = s==="you" ? picks[i] : HANDS[i][s].action;
      const m = slot.querySelector(".mark"); m.className = "mark on " + (correct(a,HANDS[i])?"ok":"no"); m.textContent = correct(a,HANDS[i])?"✓":"✗";
    }
    await wait(250);
  }
  await wait(700);
  showResults();
};

function showResults(){
  const sc = s => HANDS.filter((h,i)=>correct(s==="you"?picks[i]:h[s].action,h)).length;
  const you = sc("you"), b = sc("baseline"), f = sc("full");
  $("#score").innerHTML = `<div style="color:var(--you)">You <b>${you}/3</b></div><div style="color:var(--base)">Baseline <b>${b}/3</b></div><div style="color:var(--full)">Full harness <b>${f}/3</b></div>`;
  const mini = h => `<span class="minicards">${h.player.map(([r,s])=>`<span class="${red(s)?"r":""}">${r}${s}</span>`).join("")}<em>vs</em><span class="${red(h.up[1])?"r":""}">${h.up[0]}${h.up[1]}</span></span>`;
  const cell = (a,h) => a ? `<span class="act ${correct(a,h)?"ok":"no"}">${a}</span>` : `<span class="act no inv">invalid</span>`;
  $("#rows").innerHTML = HANDS.map((h,i)=>`
    <tr class="row" data-i="${i}"><td>${mini(h)}</td><td>${cell(picks[i],h)}</td><td>${cell(h.baseline.action,h)}</td><td>${cell(h.full.action,h)}</td><td class="basic">${h.basic}</td></tr>
    <tr class="detail" id="d${i}"><td colspan="5"><div class="detail-in"><div><div class="dgrid">
      <div class="why" style="--c:var(--base)"><h4>Baseline · ${fmt(h.baseline.action)}</h4>${h.baseline.text}</div>
      <div class="why" style="--c:var(--full)"><h4>Full harness · ${h.full.action}</h4>${h.full.text}</div>
      <div class="why odds" style="--c:var(--gold)"><h4>Odds the full harness saw</h4>
        Bust chance if you hit <div class="bustbig">${h.odds.bust.toFixed(1)}%</div>
        Dealer final total (${h.up[0]} up)
        <div class="dist">${Object.entries(h.odds.dealer).map(([k,v])=>`<span>${k}</span><span class="b"><i class="${k==="Bust"?"bust":""}" data-w="${v*2}"></i></span><span>${v.toFixed(1)}%</span>`).join("")}</div>
      </div></div></div></div></td></tr>`).join("");
  $$("tr.row").forEach(r=>r.onclick=()=>{
    const d = $("#d"+r.dataset.i), open = !d.classList.contains("open");
    d.classList.toggle("open", open); r.classList.toggle("open", open);
    d.querySelectorAll(".dist i").forEach(i=>i.style.width = open ? Math.min(100,i.dataset.w)+"%" : "0");
  });
  const nv = (BOARD.visitors*BOARD.deals/100 + you) / (BOARD.deals+3) * 100;
  $("#board").innerHTML = `<h3><span>Live board</span><span class="live" style="color:#ff5a4a;font-family:system-ui;font-size:.7em;letter-spacing:.2em">● LIVE</span></h3>
    ${[["Visitors",nv,"var(--you)"],["Baseline",BOARD.baseline,"var(--base)"],["Full harness",BOARD.full,"var(--full)"]].map(([n,p,c])=>`<div class="r"><div><span>${n}</span><b>${p.toFixed(1)}%</b></div><div class="bar"><i style="background:${c}" data-w="${p}"></i></div></div>`).join("")}
    <small>Correct first decisions over ${BOARD.deals+3} deals visitors played</small>
    <button class="cta again" id="again">Play again</button>`;
  $("#scrim").classList.add("on"); $("#results").classList.add("on");
  setTimeout(()=>{ $$("#board .bar i").forEach(i=>i.style.width=i.dataset.w+"%"); renderPlaque(nv); }, 700);
  $("#again").onclick = ()=>location.reload();
}
</script>
</body>
</html>
